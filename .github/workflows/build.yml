name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Run Gosec Security Scanner
      uses: securego/gosec@5bb2909d48fa8072136f38ad329b37575ab15c9f # master
      with:
        args: -exclude=G204 ./...

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: 1.17

    - name: Test
      run: go test -v ./...

    - name: Build
      run: go build
